name: windows
on:
  push:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Claude Code (native)
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: claude --version
      - run: npm run build:win
      - name: End-to-end test on Windows
        run: node test/e2e-win.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            ${{ runner.temp }}/bipolar-e2e-*/*.png
            ${{ runner.temp }}/bipolar-e2e-*/*.txt
            ~/.config/switchboard/*.log
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bipolar-Windows-x64
          path: dist/Bipolar-win32-x64
